[project]
name = "moe-transformer-pallas"
version = "0.1.0"
description = "A from-scratch ~10M-param MoE transformer in JAX with a custom Pallas kernel."
requires-python = ">=3.12"
dependencies = [
    "jax",
    "optax>=0.2.8",
]

[project.optional-dependencies]
tpu = [
    "jax[tpu]>=0.12.0.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moe"]
